stages:
  - build
  - check

variables:
  GET_SOURCES_ATTEMPTS: 3
  NPM_CONFIG_CACHE: .npm

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # "Run pipeline" pipelines exist only for the live E2E job.
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

.base_job: &base_job
  image: node:24.22.1
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - npm ci --cache .npm --prefer-offline

build:
  <<: *base_job
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

eslint:
  <<: *base_job
  stage: check
  script:
    - npm run eslint

stylelint:
  <<: *base_job
  stage: check
  script:
    - npm run stylelint

prettier:
  <<: *base_job
  stage: check
  script:
    - npx prettier --check .

typecheck:
  <<: *base_job
  stage: check
  script:
    - npm run typecheck

prod_audit:
  <<: *base_job
  stage: check
  # npm audit reads only package-lock.json, so the job skips npm ci.
  before_script: []
  script:
    - npm audit --omit=dev --audit-level=high

secret_check:
  <<: *base_job
  stage: check
  script:
    - npm run secrets:check

unit_tests:
  <<: *base_job
  stage: check
  script:
    - npm test

e2e_tests:
  <<: *base_job
  image: mcr.microsoft.com/playwright:v1.58.1-noble
  stage: check
  variables:
    PLAYWRIGHT_WORKERS: 2
  script:
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 1 week

# Opt-in live suite against a running backend. Needs the CI/CD variables
# PLAYWRIGHT_TEST_EMAIL and PLAYWRIGHT_TEST_PASSWORD (masked) and VITE_API_TARGET.
# The preflight fails the job and names whichever of them is missing or unreachable.
e2e_live:
  <<: *base_job
  image: mcr.microsoft.com/playwright:v1.58.1-noble
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    PLAYWRIGHT_WORKERS: 1
  # No artifacts: failure snapshots capture the login form with the credentials.
  script:
    - npm run test:e2e:live
