# Vite dev server with hot reload. The API proxy targets the backend nginx
# published on the host at :8001, so this file runs alone or next to the backend.
services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "[ node_modules/.package-lock.json -nt package-lock.json ] || npm ci;
      exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      VITE_API_TARGET: http://host.docker.internal:8001
      HUSKY: "0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  frontend_node_modules:
