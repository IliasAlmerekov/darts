name: Jules review

# A review when a PR opens, reopens, or leaves draft. Later pushes to the branch do not start
# a new session; reopening the PR asks for a fresh review.
#
# pull_request_target runs this file and scripts/jules-review.mjs from the base branch, so a
# PR cannot change the code that holds JULES_API_KEY and the write token. The job reads the PR
# only through git diff and never runs its code.
on:
  # TEMP: lets PR #224 test this branch; revert before merge.
  pull_request:
    types:
      - reopened
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

concurrency:
  group: jules-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Jules starts from a branch of this repository, so fork PRs are skipped. Dependabot PRs
    # are skipped by author, since a human who reopens one becomes the actor.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Write the PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git diff --no-color --no-ext-diff "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"

      - name: Review with Jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DIFF_FILE: ${{ runner.temp }}/pr.diff
        run: node scripts/jules-review.mjs
