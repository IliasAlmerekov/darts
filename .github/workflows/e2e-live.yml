name: E2E live

# Opt-in live suite against a running backend. Needs the repository secrets
# PLAYWRIGHT_TEST_EMAIL and PLAYWRIGHT_TEST_PASSWORD and the repository variable
# VITE_API_TARGET. The preflight fails the run and names whichever of them is missing
# or unreachable. Manual runs only: the suite signs in and out as the production admin,
# which a scheduled run would do while the tablet may be in use.
on:
  workflow_dispatch:

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image ships Chromium and its system libraries, so no step waits on apt (#275).
    # Keep its tag on the @playwright/test version from package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No-op while the tag matches @playwright/test. After a version bump it downloads
      # the newer Chromium; the image already has its system libraries.
      - name: Install Playwright browsers
        run: npx playwright install chromium

      # No report upload: failure snapshots capture the login form, and artifacts
      # of this public repo are downloadable by anyone.
      - name: E2E tests (live)
        run: npm run test:e2e:live
        env:
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          VITE_API_TARGET: ${{ vars.VITE_API_TARGET }}
