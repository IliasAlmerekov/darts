name: E2E live

# Opt-in live suite against a running backend. Needs the repository secrets
# PLAYWRIGHT_TEST_EMAIL and PLAYWRIGHT_TEST_PASSWORD and the repository variable
# VITE_API_TARGET. The preflight fails the run and names whichever of them is missing
# or unreachable.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: e2e-live
  cancel-in-progress: false

jobs:
  e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (live)
        run: npm run test:e2e:live
        env:
          PLAYWRIGHT_WORKERS: 1
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          VITE_API_TARGET: ${{ vars.VITE_API_TARGET }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: playwright-report/
          if-no-files-found: ignore
