version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # shortcut: eslint-plugin-jsx-a11y and eslint-plugin-react reject ESLint 10 as a peer (#267),
      # remove both entries once both plugins publish a release whose eslint peer range includes 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # shortcut: typescript-eslint 8.72.0 accepts typescript >=4.8.4 <6.1.0 (#302),
      # remove this entry once a typescript-eslint release accepts TypeScript 7.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # A Node major also moves .nvmrc and CI, so it is done by hand.
      - dependency-name: node
        update-types: [version-update:semver-major]
      # Odd nginx minors are mainline releases; stay on the 1.28 stable line.
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: build
      include: scope
